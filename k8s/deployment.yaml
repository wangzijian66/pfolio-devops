apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pfolio

  template:
    metadata:
      labels:
        app: pfolio
    spec:
      containers:
        - name: pfolio
          image: shiter666/pfolio-frontend:latest
          ports:
            - containerPort: 80